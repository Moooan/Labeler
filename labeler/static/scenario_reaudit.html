<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>改写后场景复审</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#222;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#fff;border-bottom:1px solid #e2e4e8;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}h1{font-size:16px;color:#334155;margin:0}header label{display:flex;align-items:center;gap:6px;font-size:13px;color:#334155}header input{width:110px}header select{max-width:180px}.header-meta{width:100%;display:flex;align-items:center;gap:16px}#stats{margin:0;color:#64748b;font-size:12px}#bar{flex:1;min-width:100px;height:7px;background:#e2e8f0;border-radius:5px;overflow:hidden}#bar div{height:100%;background:#22c55e;transition:width .3s}
button,select,input,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:6px;padding:5px 9px;background:#fff}button{cursor:pointer;font-size:13px}button:hover{background:#f1f5f9}button:disabled{opacity:.45;cursor:not-allowed}.primary,#save{background:#2563eb;color:white;border-color:#2563eb}a{color:#2563eb;text-decoration:none}#export{padding:5px 12px;border-radius:6px;font-size:13px}main{flex:1;min-height:0;display:flex;overflow:hidden}aside{width:260px;flex:none;background:white;border-right:1px solid #e2e4e8;display:flex;flex-direction:column;min-height:0}#search{margin:8px;width:calc(100% - 16px)!important}#filter{display:none}#filters{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px 8px}#filters button{padding:2px 8px;border-radius:999px;font-size:12px}#filters .on{background:#2563eb;color:#fff;border-color:#2563eb}#list{flex:1;overflow-y:auto;min-height:0}.row{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #f1f5f9;border-radius:0;margin:0;color:#334155}.row.selected{background:#eff6ff;box-shadow:inset 3px 0 #2563eb}.row-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{font-size:11px;color:#64748b}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#cbd5e1;margin-right:6px}.dot.done{background:#22c55e}.dot.conflict{background:#f59e0b}
#detail{flex:1;min-width:0;overflow-y:auto;padding:18px 22px}.card{background:#fff;border:1px solid #e2e4e8;border-radius:10px;padding:16px 18px;margin-bottom:14px}.card h2{font-size:13px;color:#64748b;margin:0 0 8px}.card h3{font-size:13px;margin:0 0 6px}#question-title{font-size:16px;color:#222;font-weight:600}.card p{margin:6px 0}.muted{color:#64748b;font-size:12px}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.cols .card{margin:0;border-radius:8px;padding:12px;font-size:13px}.cols>.card:first-child h3{color:#2563eb}.cols>.card:nth-child(2) h3{color:#7c3aed}.cols>.card:last-child{background:#f0fdf4;border-color:#86efac}.cols>.card:last-child h2{color:#16a34a}.cols .card.diff{background:#fff7ed;border-color:#fdba74}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:#f8fafc;padding:10px;border-radius:8px;max-height:220px;overflow-y:auto;color:#334155;margin:8px 0}summary{cursor:pointer;color:#475569;font-size:13px}.warn{color:#b45309}.warn:empty{display:none}.tags{border:1px solid #e2e4e8;border-radius:8px;max-height:340px;overflow:auto;margin-top:8px}.tags details>summary{padding:6px 12px;font-weight:600;background:#f8fafc}.tags details details>summary{padding-left:30px;font-weight:500;background:#fff}.tags label{display:flex;gap:7px;padding:4px 12px 4px 46px;align-items:baseline;cursor:pointer;font-size:13px}.tags label:hover{background:#f1f5f9}.tags label:has(input:checked){background:#eff6ff;color:#1d4ed8}.tags [hidden]{display:none!important}.tags input{margin:0}.tags .definition{color:#94a3b8;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}#tagSearch{width:100%;margin-top:8px}textarea{width:100%;min-height:65px;resize:vertical}.actions{position:sticky;bottom:-18px;background:#fff;padding:12px 0;border-top:1px solid #e2e8f0;margin-top:12px;display:flex;gap:12px;align-items:center}#message{background:#fffbeb;color:#92400e;padding:6px 16px;font-size:13px;display:none;flex:none}#selected-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:12px;background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;border-radius:20px;padding:2px 9px}.triage{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;display:flex;gap:12px;align-items:center}.hint{margin-left:auto;font-size:12px;color:#94a3b8}
@media(max-width:1050px){.cols{grid-template-columns:1fr 1fr}.cols>.card:last-child{grid-column:1/-1}.header-meta{flex-wrap:wrap}}@media(max-width:700px){body{height:auto;overflow:auto}main{display:block}aside{width:100%;height:260px}#detail{padding:12px}.cols{grid-template-columns:1fr}header select{max-width:140px}.hint{display:none}.actions{bottom:0}}
</style>
<header><h1>场景复审台</h1><label>复核人 <select id="left"></select> vs <select id="right"></select></label><label>操作人 <input id="operator" placeholder="填名字" autocomplete="off"></label><button id="queue">继续 / 重试</button><a id="export" class="primary">导出复审数据</a><div class="header-meta"><p id="stats">加载中…</p><div id="bar"><div></div></div></div></header>
<div id="message"></div><main><aside><input id="search" placeholder="搜索问题、ID" style="width:90%"><select id="filter" style="width:96%;margin-top:8px"><option value="all">全部记录</option><option value="disagree">两人分歧</option><option value="agree">两人相同</option><option value="missing">单人 / 缺少人工参考</option><option value="pending">等待 AI</option><option value="failed">生成失败</option><option value="final">已人工定稿</option></select><div id="filters"></div><div id="list"></div></aside><section id="detail"></section></main>
<script>
let state,selected,dirty=false,busy=false;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses={keep:'保留',drop:'不需要',insufficient:'信息不足'},jobs={done:'AI完成',queued:'排队中',running:'生成中',failed:'失败',excluded:'已排除',not_started:'未开始'},pairs={agree:'两人相同',both_drop:'两人均不需要',disagree:'两人分歧',single:'仅一人记录',none:'无已完成参考'};
function notify(t){$('message').textContent=t;$('message').style.display=t?'block':'none'}
function path(id){return state.taxonomy.find(s=>s.id===id)?.path||id}function paths(ids){return (ids||[]).map(x=>esc(path(x))).join('<br>')||'无'}
function usableRef(ref){return ref&&['keep','drop','insufficient'].includes(ref.status)}
function params(){return new URLSearchParams({left:$('left').value,right:$('right').value})}
async function api(url,data){const r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
async function refresh(){if(busy||dirty)return;try{state=await api('/api/state?'+params());for(const k of ['left','right']){$(k).innerHTML=state.sources.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$(k).value=state[k]}const c=state.counts;$('stats').textContent=`共 ${state.total} 条 · AI完成 ${c.done||0} · 生成中 ${c.running||0} · 排队 ${c.queued||0} · 失败 ${c.failed||0} · 定稿 ${state.finalized} | 快照 ${new Date(state.created_at).toLocaleString()}`;$('export').href='/api/export?'+params();$('bar').firstElementChild.style.width=((c.done||0)/Math.max(1,state.total)*100)+'%';if(!state.rows.some(r=>r.note_id===selected))selected=state.rows.find(r=>r.eligible)?.note_id||state.rows[0]?.note_id;renderList();renderDetail()}catch(e){notify(e.message)}}
function matchesFilter(r,f){if(f==='all')return true;if(f==='final')return !!r.final;if(r.final)return false;return f==='disagree'&&r.pair_kind==='disagree'||f==='agree'&&['agree','both_drop'].includes(r.pair_kind)||f==='missing'&&['single','none'].includes(r.pair_kind)||f==='pending'&&['queued','running','not_started'].includes(r.job)||f==='failed'&&r.job==='failed'}
function updateFilterCounts(){const labels={all:'全部记录',disagree:'两人分歧',agree:'两人相同',missing:'单人 / 缺少人工参考',pending:'等待 AI',failed:'生成失败',final:'已人工定稿'};document.querySelectorAll('#filters button').forEach(b=>{const n=state.rows.filter(r=>matchesFilter(r,b.dataset.value)).length;b.textContent=`${labels[b.dataset.value]} ${n}`})}
function renderList(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;updateFilterCounts();const rows=state.rows.filter(r=>(r.utterance+' '+r.title+' '+r.note_id).toLowerCase().includes(q)).filter(r=>matchesFilter(r,f));if(!rows.some(r=>r.note_id===selected))selected=rows[0]?.note_id||null;$('list').innerHTML=rows.map(r=>`<button class="row ${r.note_id===selected?'selected':''}" data-id="${esc(r.note_id)}"><span class="row-title" title="${esc(r.title||r.note_id)}"><span class="dot ${r.pair_kind==='disagree'?'conflict':r.job}"></span>${esc(r.title||r.note_id)}</span><small>${jobs[r.job]} · ${pairs[r.pair_kind]}</small></button>`).join('')||'<p class="muted" style="padding:16px">该分类已全部处理完成</p>';$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(busy)return;if(dirty&&!confirm('当前定稿尚未保存，放弃修改并切换？'))return;dirty=false;selected=b.dataset.id;notify('');renderList();renderDetail()})}
function refHtml(ref,label,comparison){return `<div class="card ${comparison?.conflict?'diff':''}"><h3>${esc(label)}</h3>${ref?`<b>${esc(statuses[ref.status]||'尚未完成')}</b><p>${paths(ref.scenarios)}</p><p>${esc(ref.comment)}</p>`:'缺少此人的记录'}${comparison?`<p class="${comparison.conflict?'warn':''}">${comparison.conflict?'与 AI 有差异':'与 AI 一致'}${comparison.status_changed?'；保留状态改变':''}</p>${comparison.added.length?'<p>AI 新增：<br>'+paths(comparison.added)+'</p>':''}${comparison.removed.length?'<p>AI 移除：<br>'+paths(comparison.removed)+'</p>':''}`:''}</div>`}

function treeHtml(selected){
 const groups=new Map();for(const s of state.taxonomy){if(!groups.has(s.l1))groups.set(s.l1,new Map());const g=groups.get(s.l1);if(!g.has(s.l2))g.set(s.l2,[]);g.get(s.l2).push(s)}
 return [...groups].map(([l1,groups])=>`<details ${[...groups.values()].flat().some(s=>selected.includes(s.id))?'open':''}><summary>${esc(l1)}</summary>${[...groups].map(([l2,leaves])=>`<details ${leaves.some(s=>selected.includes(s.id))?'open':''}><summary>${esc(l2)}</summary>${leaves.map(s=>`<label data-path="${esc((s.path+' '+s.id).toLowerCase())}"><input type="checkbox" value="${esc(s.id)}" ${selected.includes(s.id)?'checked':''}><span>${esc(s.id)} ${esc(s.l3)}</span><span class="definition" title="${esc(s.definition)}">${esc(s.definition)}</span></label>`).join('')}</details>`).join('')}</details>`).join('');
}
function filterTree(q){$('tags').querySelectorAll('label').forEach(l=>l.hidden=!l.dataset.path.includes(q));[...$('tags').querySelectorAll('details')].reverse().forEach(d=>{d.hidden=![...d.querySelectorAll('label')].some(l=>!l.hidden);if(q)d.open=!d.hidden})}
function updateSelected(){const ids=[...$('tags').querySelectorAll('input:checked')].map(i=>i.value);$('selected-tags').innerHTML=ids.map(id=>`<span class="chip">${esc(path(id))}</span>`).join('')||'<span class="muted">尚未选择场景</span>';for(const i of $('tags').querySelectorAll('input:checked')){let el=i.closest('details');while(el){el.open=true;el=el.parentElement.closest('details')}}}

function renderDetail(){const r=state.rows.find(x=>x.note_id===selected);if(!r){$('detail').innerHTML='<div class="card muted">该分类已全部处理完成，请切换其他分类。</div>';return}const final=r.final||{};const suggested=final.status?final:(r.ai?.ok?r.ai:(usableRef(r.a)?r.a:usableRef(r.b)?r.b:{status:'keep',scenarios:[],reason:''}));const aiHeading=r.ai?.classification_fallback==='human_consensus'?'AI失败 · 人工一致兜底':'AI 独立复审';$('detail').innerHTML=`<div class="card"><h2 id="question-title">${esc(r.title)}</h2><div class="muted">${esc(r.note_id)} · ${jobs[r.job]} · ${pairs[r.pair_kind]}</div>${!r.eligible?`<p class="warn">${esc(r.excluded_reason)}</p>`:''}<p class="warn">${esc(r.change_hint||'')}</p><pre>${esc(r.utterance||'（空）')}</pre><details><summary>查看拼接来源</summary><h3>context</h3><pre>${esc(r.context||'（不使用）')}</pre><h3>query</h3><pre>${esc(r.query||'（不使用）')}</pre><p>${esc(r.query_source)}</p></details></div><div class="cols">${refHtml(r.a,state.left,r.comparison_a)}${refHtml(r.b,state.right,r.comparison_b)}<div class="card"><h2>${aiHeading}</h2>${r.ai?.ok?`<b>${statuses[r.ai.status]}</b><p>${paths(r.ai.scenarios)}</p><p>${esc(r.ai.reason)}</p><p class="warn">${esc(r.suggestion.text)}</p>`:`<p>${esc(r.ai?.error||jobs[r.job])}</p>`}<div class="muted">${r.ai?.classification_fallback==='human_consensus'?'标题取当前query开头；该结果不是AI独立判断，请按人工结论核对。':'AI结果仅作定稿参考，不会自动覆盖人工结论。'}</div></div></div><details class="card"><summary>其他历史参考</summary>${Object.entries(r.references).map(([k,v])=>refHtml(v,k,null)).join('')}</details>${r.eligible?`<div class="card" id="editor"><h2>本轮人工定稿</h2><div class="triage"><b>本条是否保留？</b><select id="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${suggested.status===k?'selected':''}>${v}</option>`).join('')}</select><span class="hint">${final.status?'已加载保存结果':'已预填建议，可直接核对提交'}</span></div><p><button id="useA">采用 A</button> <button id="useB">采用 B</button> <button id="useAI">采用 AI</button></p><div id="selected-tags"></div><input id="tagSearch" placeholder="搜索三级场景"><div class="tags" id="tags">${treeHtml(suggested.scenarios||[])}</div><p>选择最多 5 个场景；保留时至少选 1 个。</p><textarea id="reason" placeholder="定稿依据">${esc(final.reason||suggested.reason||suggested.comment||'')}</textarea><p><label><input id="conflictMark" type="checkbox" ${final.conflict_mark?'checked':''}> 标记改写前后场景冲突</label></p><div class="actions"><button id="save">确认并提交</button> <span id="savehint" class="muted">${final.operator?'已由 '+esc(final.operator)+' 保存，版本 '+final.revision:'核对上方预填结果后提交'}</span></div></div>`:''}`;
if(!r.eligible)return;updateSelected();const edited=()=>{dirty=true;notify('有未保存的定稿修改，自动刷新已暂停。')};$('editor').addEventListener('change',e=>{if(e.target.id!=='tagSearch'){edited();updateSelected()}});$('reason').oninput=edited;$('operator').oninput=edited;$('tagSearch').oninput=()=>{const q=$('tagSearch').value.toLowerCase();filterTree(q)};for(const [id,v] of [['useA',r.a],['useB',r.b],['useAI',r.ai?.ok?r.ai:null]]){$(id).disabled=!v||!statuses[v.status];$(id).onclick=()=>{$('status').value=v.status;$('tags').querySelectorAll('input').forEach(i=>i.checked=v.scenarios.includes(i.value));updateSelected();$('reason').value=v.reason||v.comment||'参考 '+(v.source||'AI')+' 结论';edited()}}$('save').onclick=async()=>{const ids=[...$('tags').querySelectorAll('input:checked')].map(x=>x.value),operator=$('operator').value.trim(),status=$('status').value;if(!operator){notify('请先在页面顶部填写操作人姓名。');$('operator').focus();return}if(status==='keep'&&!ids.length){notify('当前选择“保留”，请至少选择一个场景，或点击“采用 AI / A / B”。');$('tagSearch').focus();return}if(ids.length>5){notify('最多选择 5 个场景');return}busy=true;$('save').disabled=true;try{await api('/api/final',{note_id:r.note_id,operator,status,scenarios:ids,reason:$('reason').value,revision:final.revision||0,conflict_mark:$('conflictMark').checked,left:state.left,right:state.right});localStorage.setItem('reaudit_operator',operator);dirty=false;notify('本轮定稿已保存。')}catch(e){notify(e.message)}finally{busy=false;if($('save'))$('save').disabled=false;await refresh()}}}
$('search').oninput=()=>state&&renderList();$('filter').onchange=()=>{document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.value===$('filter').value));if(state)renderList()};for(const k of ['left','right'])$(k).onchange=()=>{if(dirty){$(k).value=state[k];notify('请先保存当前修改，再切换参考人');return}if($('left').value===$('right').value){$(k).value=state[k];notify('请选择不同的两位参考人');return}refresh()};$('queue').onclick=async()=>{try{const v=await api('/api/queue',{});notify(`新增排队 ${v.queued} 条，后台会继续执行。`);refresh()}catch(e){notify(e.message)}};
// Omit empty selectors on first fetch so the server supplies the saved default pair.
params=()=>new URLSearchParams(Object.fromEntries(['left','right'].filter(k=>$(k).value).map(k=>[k,$(k).value])));
$('operator').value=localStorage.getItem('reaudit_operator')||'';
$('operator').oninput=()=>localStorage.setItem('reaudit_operator',$('operator').value);
$('filters').innerHTML=[...$('filter').options].map(o=>`<button data-value="${o.value}" class="${o.value==='all'?'on':''}">${o.text}</button>`).join('');
$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('filter').value=b.dataset.value;$('filter').onchange()});
refresh();setInterval(refresh,8000);
</script></html>
