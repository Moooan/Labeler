<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PathPal 标签复核</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #222; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e2e4e8; padding: 10px 16px;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; color: #334155; }
  .who { font-size: 13px; color: #334155; display: flex; align-items: center; gap: 4px; }
  #who { width: 110px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  #who.missing { border-color: #ef4444; background: #fef2f2; }
  #meta { color: #64748b; font-size: 13px; }
  #bar { flex: 1; min-width: 160px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  #bar > div { height: 100%; background: #22c55e; width: 0; transition: width .3s; }
  button { border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 5px 12px;
           cursor: pointer; font-size: 13px; }
  button:hover { background: #f1f5f9; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  main { flex: 1; display: flex; overflow: hidden; }
  #side { width: 250px; background: #fff; border-right: 1px solid #e2e4e8; display: flex;
          flex-direction: column; }
  #filters { padding: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  #filters button { padding: 2px 8px; font-size: 12px; border-radius: 999px; }
  #filters button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  #list { flex: 1; overflow-y: auto; }
  #list .item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
                display: flex; gap: 6px; align-items: baseline; }
  #list .item:hover { background: #f8fafc; }
  #list .item.cur { background: #eff6ff; }
  #list .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; top: -1px; }
  .dot.todo { background: #cbd5e1; } .dot.done { background: #22c55e; }
  .dot.skip { background: #f59e0b; } .dot.badfit { background: #ef4444; }
  .dot.drop { background: #64748b; } .dot.ins { background: #a855f7; }
  #triage { display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 10px;
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; flex-wrap: wrap; }
  #triage .q { font-weight: 700; color: #334155; }
  button.tg { padding: 6px 14px; font-size: 14px; }
  button.tg.keep.on { background: #16a34a; border-color: #16a34a; color: #fff; }
  button.tg.drop.on { background: #ef4444; border-color: #ef4444; color: #fff; }
  button.tg.ins.on { background: #a855f7; border-color: #a855f7; color: #fff; }
  #no-label-hint { margin-top: 8px; padding: 8px 12px; background: #f8fafc; border-radius: 8px;
                   color: #64748b; font-size: 13px; }
  #list .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #334155; }
  #panel { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .card { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; padding: 16px 18px;
          margin-bottom: 14px; }
  .card h2 { font-size: 13px; color: #64748b; margin-bottom: 8px; font-weight: 600; }
  #title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  #desc { white-space: pre-wrap; word-break: break-word; color: #334155; max-height: 300px;
          overflow-y: auto; background: #f8fafc; padding: 10px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #cbd5e1; border-radius: 999px; padding: 3px 10px; cursor: pointer;
          background: #fff; font-size: 13px; user-select: none; }
  .chip.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  .chip.sel { background: #dbeafe; border-color: #2563eb; color: #1e40af; }
  .chip.sel b { cursor: pointer; margin-left: 6px; font-weight: 700; }
  .treebar { display: flex; gap: 8px; margin: 10px 0 8px; align-items: center; }
  #search { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
  #tree { border: 1px solid #e2e4e8; border-radius: 8px; max-height: 460px; overflow-y: auto;
          background: #fff; }
  .l1h { padding: 7px 12px; font-weight: 700; cursor: pointer; background: #f8fafc;
         border-bottom: 1px solid #eef2f6; user-select: none; display: flex; gap: 8px;
         align-items: center; }
  .l1h .arrow { width: 14px; color: #64748b; display: inline-block; }
  .l1h .cnt { color: #2563eb; font-weight: 700; }
  .l1b.closed > .l2b { display: none; }   /* 收起只藏子级，标题头保留可再点 */
  .l2b.closed > .leaf { display: none; }
  .l2h { padding: 4px 12px 4px 34px; font-weight: 600; color: #475569; cursor: pointer;
         user-select: none; font-size: 13px; }
  .leaf { display: flex; gap: 8px; align-items: baseline; padding: 3px 12px 3px 52px;
          cursor: pointer; border-radius: 4px; }
  .leaf:hover { background: #f1f5f9; }
  .leaf.checked { background: #eff6ff; }
  .leaf input { position: relative; top: 2px; }
  .leaf .id { color: #2563eb; font-weight: 600; font-size: 12px; flex: none; }
  .leaf .name { flex: none; }
  .leaf .def { color: #94a3b8; font-size: 12px; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; flex: 1; min-width: 0; }
  .leaf .m { flex: none; background: #2563eb; color: #fff; border-radius: 4px; font-size: 11px;
             padding: 0 4px; }
  .leaf.hidden { display: none; }
  .warn { color: #ef4444; font-size: 12px; margin-top: 4px; display: none; }
  label.ck { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; cursor: pointer; }
  textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px;
             font: inherit; }
  #badfitbox { margin-top: 10px; padding: 10px; background: #fef2f2; border: 1px solid #fecaca;
               border-radius: 8px; display: none; }
  #badfitbox select, #badfitbox textarea { margin-top: 6px; }
  .actions { display: flex; gap: 10px; align-items: center; margin: 4px 0 30px; }
  #saved { color: #16a34a; font-size: 13px; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff;
           padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .3s; pointer-events: none; max-width: 60vw; }
</style>
</head>
<body>
<header>
  <h1>标签复核</h1>
  <label class="who">复核人 <input id="who" list="known-reviewers"
         placeholder="填你的名字" autocomplete="off"></label>
  <datalist id="known-reviewers"></datalist>
  <span id="meta"></span>
  <div id="bar"><div></div></div>
  <button id="btn-import">导入Excel</button>
  <button id="btn-export" class="primary">导出Excel</button>
  <input type="file" id="file" accept=".xlsx" hidden>
</header>
<main>
  <div id="side">
    <div id="filters"></div>
    <div id="list"></div>
  </div>
  <div id="panel">
    <div class="card">
      <div id="title"></div>
      <div id="desc"></div>
      <div id="triage">
        <span class="q">这条 query：</span>
        <button class="tg keep on" data-v="keep">✔ 保留（继续打标）</button>
        <button class="tg drop" data-v="drop">✘ 不需要</button>
        <button class="tg ins" data-v="insufficient">⚠ 缺少信息（可先打标）</button>
      </div>
      <div id="no-label-hint" style="display:none"></div>
    </div>
    <div class="card" id="card-missing" style="display:none">
      <h2>需要补充的信息（打标照常；这条还缺什么才能判得更准？）</h2>
      <textarea id="missing" rows="2"
        placeholder="如：目标专业/国家、当前年级、期望城市、全职还是实习、预算范围…"></textarea>
    </div>
    <div class="card" id="card-scen">
      <h2 id="sel-title">场景（在下方标签树里勾选，最多 5 个；带「机」= 机器原判）</h2>
      <div class="chips" id="sel-chips"></div>
      <div class="treebar">
        <input id="search" placeholder="过滤（可留空，直接在树里勾选）" autocomplete="off">
        <button id="btn-expand">展开全部</button>
        <button id="btn-collapse">收起全部</button>
      </div>
      <div id="tree"></div>
      <div class="warn" id="maxwarn">最多选 5 个场景，先取消一个再勾选</div>
      <label class="ck" style="margin-top:10px"><input type="checkbox" id="badfit">
        场景不够用（帖子明显属于某领域但现有叶子都不对）</label>
      <div id="badfitbox">
        <div>建议新场景路径（一级 &gt; 二级 &gt; 新叶子）：</div>
        <select id="badfit-l1"></select>
        <textarea id="badfit-text" rows="2" placeholder="就业 > 求职流程 > 内推渠道：讲内推怎么找、找谁、流程"></textarea>
      </div>
    </div>
    <div class="card" id="card-intent">
      <h2>意图（可多选）</h2>
      <div id="intents" class="chips"></div>
    </div>
    <div class="card" id="card-persona">
      <h2>画像（每行一条「字段: 值 [明确/推测]」，删行=剔除该字段）</h2>
      <textarea id="persona" rows="3"></textarea>
    </div>
    <div class="card">
      <h2>备注</h2>
      <textarea id="comment" rows="2"></textarea>
    </div>
    <div class="actions">
      <button id="btn-prev">← 上一条</button>
      <button id="btn-save" class="primary">保存并下一条（Ctrl+Enter）</button>
      <button id="btn-skip">跳过（暂不处理）</button>
      <span id="saved"></span>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
let S = null, cur = 0, dirty = false, filter = 'todo', sel = [], verdict = 'keep';
let reviewer = localStorage.getItem('pp_reviewer') || '';
const expanded = { l1: new Set(), l2: new Set() };   // 展开状态（跨笔记保留）
const VERDICT_CN = { keep: '保留', drop: '不需要', insufficient: '缺少信息', skip: '跳过' };

const $ = id => document.getElementById(id);
const toast = m => { const t = $('toast'); t.textContent = m; t.style.opacity = 1;
                     clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2500); };
const noteOf = i => S.notes[i];
const recOf = i => (S.session || {})[noteOf(i).note_id];
const statusOf = i => { const r = recOf(i); return r ? r.status : 'todo'; };

async function fetchState() {
  S = await (await fetch('/api/state?reviewer=' + encodeURIComponent(reviewer))).json();
  if (!reviewer && S.reviewer) reviewer = S.reviewer;   // 服务端 --reviewer 默认名兜底
  for (const r of Object.values(S.session || {}))       // 兼容旧数据：done → keep
    if (r.status === 'done') r.status = 'keep';
  $('who').value = reviewer;
  $('who').classList.toggle('missing', !reviewer);
  $('known-reviewers').innerHTML =
    S.reviewers.filter(r => r !== reviewer).map(r => `<option value="${r}">`).join('');
}

async function boot() {
  await fetchState();
  const fs = [['todo','未复核'],['keep','保留'],['drop','不需要'],['insufficient','缺少信息'],
              ['skip','跳过'],['badfit','场景不够用'],['all','全部']];
  $('filters').innerHTML = '';
  for (const [k, label] of fs) {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.k = k;
    b.onclick = () => { filter = k; renderList(); };
    $('filters').appendChild(b);
  }
  for (const l1 of S.l1s) { const o = document.createElement('option'); o.value = o.textContent = l1;
                            $('badfit-l1').appendChild(o); }
  $('meta').textContent = `复核人 ${reviewer || '？'} · ${S.run} · 共 ${S.total} 条`;
  buildTree();
  renderList(); go(0);

  $('btn-save').onclick = () => save(verdict, true);
  $('btn-skip').onclick = () => save('skip', true);
  $('triage').onclick = e => {
    const b = e.target.closest('button.tg');
    if (!b) return;
    verdict = b.dataset.v; mark(); syncTriage();
  };
  $('btn-prev').onclick = () => go(cur - 1);
  $('btn-export').onclick = exportX;
  $('btn-import').onclick = () => $('file').click();
  $('file').onchange = importX;
  $('search').oninput = applyFilter;
  $('btn-expand').onclick = () => { for (const g of treeData)
      { expanded.l1.add(g.l1); for (const g2 of g.groups) expanded.l2.add(g.l1 + '/' + g2.l2); }
    applyFilter(); };
  $('btn-collapse').onclick = () => { expanded.l1.clear(); expanded.l2.clear(); applyFilter(); };
  $('badfit').onchange = () => { $('badfitbox').style.display = $('badfit').checked ? 'block' : 'none';
                                if ($('badfit').checked && !$('badfit-text').value)
                                  $('badfit-text').value = $('badfit-l1').value + ' > '; mark(); };
  $('badfit-l1').onchange = () => { const v = $('badfit-text').value;
    if (!v || / > $/.test(v)) $('badfit-text').value = $('badfit-l1').value + ' > '; };
  $('comment').oninput = mark; $('persona').oninput = mark; $('missing').oninput = mark;
  $('who').onchange = async () => {
    const v = $('who').value.trim();
    if (!v) { $('who').classList.add('missing'); return toast('复核人名字不能为空'); }
    if (v === reviewer) return;
    if (dirty) await save(autoStatus(cur), false);  // 先存旧的
    reviewer = v;
    localStorage.setItem('pp_reviewer', reviewer);
    $('who').classList.remove('missing');
    await fetchState(); renderList(); renderNote();
    toast(`已切换为复核人 ${reviewer}，进度 ${doneCount()}/${S.total}`);
  };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(verdict, true); }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing && e.key === 'ArrowRight') go(cur + 1);
    if (!typing && e.key === 'ArrowLeft') go(cur - 1);
  });
}
function mark() { dirty = true; $('saved').textContent = '未保存'; }

function renderList() {
  [...$('filters').children].forEach(b => b.classList.toggle('on', b.dataset.k === filter));
  $('list').innerHTML = '';
  S.notes.forEach((n, i) => {
    const st = statusOf(i);
    const r = recOf(i);
    const show = filter === 'all' || (filter === 'badfit' ? (r && r.bad_fit) : st === filter);
    if (!show) return;
    const d = document.createElement('div');
    d.className = 'item' + (i === cur ? ' cur' : '');
    const cls = (r && r.bad_fit) ? 'badfit' : ({ keep: 'done', insufficient: 'ins' }[st] || st);
    d.innerHTML = `<span class="dot ${cls}"></span><span class="t">${n.title || n.note_id}</span>`;
    d.onclick = () => go(i);
    $('list').appendChild(d);
  });
}

function syncTriage() {
  for (const b of $('triage').querySelectorAll('button.tg'))
    b.classList.toggle('on', b.dataset.v === verdict);
  const labeling = verdict !== 'drop';   // 只有「不需要」不打标；缺少信息照常打标+补一句缺什么
  for (const id of ['card-scen', 'card-intent', 'card-persona'])
    $(id).style.display = labeling ? '' : 'none';
  $('no-label-hint').style.display = verdict === 'drop' ? '' : 'none';
  $('no-label-hint').textContent =
    '已判定「不需要」——无需打标；原因可写在下方备注，然后保存进下一条。';
  $('card-missing').style.display = verdict === 'insufficient' ? '' : 'none';
}

const autoStatus = i => statusOf(i) === 'todo' ? 'keep' : statusOf(i);

function go(i) {
  if (i < 0 || i >= S.notes.length) return;
  if (dirty && cur !== i) save(autoStatus(cur), false);
  cur = i; dirty = false; renderList(); renderNote();
  const el = [...$('list').children].find(x => x.classList.contains('cur'));
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function renderNote() {
  const n = noteOf(cur), r = recOf(cur);
  $('title').textContent = (n.title || '(无标题)') + `  [${n.note_id}]`;
  $('desc').textContent = n.desc || '(无正文)';
  sel = r ? [...r.scenarios] : n.machine.scenarios.map(s => s.id);
  renderSel(); updateTree();
  const ints = r ? [...r.intents] : n.machine.intents.map(i => i.id);
  $('intents').innerHTML = '';
  for (const it of S.intents) {
    const c = document.createElement('span');
    c.className = 'chip' + (ints.includes(it.id) ? ' on' : '');
    c.textContent = `${it.id} ${it.name}`;
    c.dataset.id = it.id;
    c.onclick = () => { c.classList.toggle('on'); mark(); };
    $('intents').appendChild(c);
  }
  $('persona').value = r ? r.persona.join('\n') : n.machine.persona.join('\n');
  $('comment').value = r ? r.comment : '';
  $('missing').value = r ? (r.missing_info || '') : '';
  $('badfit').checked = !!(r && r.bad_fit);
  $('badfitbox').style.display = $('badfit').checked ? 'block' : 'none';
  $('badfit-text').value = r ? r.new_scenario : '';
  verdict = (r && r.status !== 'skip' && VERDICT_CN[r.status]) ? r.status : 'keep';  // skip 重新进来当作未分诊
  syncTriage();
  $('saved').textContent = r && r.status ? `已保存（${VERDICT_CN[r.status] || r.status}）` : '';
}

// ── 场景树：整棵标签体系摆出来勾选（选择题，不是搜索填空题）──────────
let treeData = [];
function buildTree() {
  treeData = [];
  for (const s of S.scenarios) {
    const parts = s.path.split(' > ');
    const l1 = parts[0] || s.id, l2 = parts[1] || '其他', name = parts[parts.length - 1];
    let g = treeData.find(x => x.l1 === l1);
    if (!g) { g = { l1, groups: [] }; treeData.push(g); }
    let g2 = g.groups.find(x => x.l2 === l2);
    if (!g2) { g2 = { l2, leaves: [] }; g.groups.push(g2); }
    g2.leaves.push({ ...s, l1, l2, name });
  }
  const root = $('tree');
  root.innerHTML = '';
  for (const g of treeData) {
    const l1b = document.createElement('div'); l1b.className = 'l1b'; l1b.dataset.l1 = g.l1;
    const h = document.createElement('div'); h.className = 'l1h';
    h.innerHTML = `<span class="arrow">▸</span><span>${g.l1}</span><span class="cnt"></span>`;
    h.onclick = () => { expanded.l1.has(g.l1) ? expanded.l1.delete(g.l1) : expanded.l1.add(g.l1);
                        applyFilter(); };
    l1b.appendChild(h); l1b._h = h;
    for (const g2 of g.groups) {
      const l2b = document.createElement('div'); l2b.className = 'l2b';
      const key = g.l1 + '/' + g2.l2;
      const h2 = document.createElement('div'); h2.className = 'l2h';
      h2.textContent = '▸ ' + g2.l2;
      h2.onclick = () => { expanded.l2.has(key) ? expanded.l2.delete(key) : expanded.l2.add(key);
                           applyFilter(); };
      l2b.appendChild(h2); l2b._h = h2;
      for (const lf of g2.leaves) {
        const row = document.createElement('label'); row.className = 'leaf';
        row.dataset.id = lf.id; row.dataset.key = key; row.dataset.l1 = g.l1;
        row.innerHTML = `<input type="checkbox"><span class="id">${lf.id}</span>` +
          `<span class="name">${lf.name}</span><span class="def">${lf.definition}</span>` +
          `<span class="m" style="display:none">机</span>`;
        row.onclick = e => { e.preventDefault(); toggleLeaf(lf.id); };
        l2b.appendChild(row);
      }
      l1b.appendChild(l2b);
    }
    root.appendChild(l1b);
    g._el = l1b;
  }
}

function toggleLeaf(id) {
  const i = sel.indexOf(id);
  if (i >= 0) { sel.splice(i, 1); }
  else {
    if (sel.length >= S.max_scenarios) {
      const w = $('maxwarn'); w.style.display = 'block';
      setTimeout(() => w.style.display = 'none', 1800); return;
    }
    sel.push(id);
  }
  mark(); renderSel(); updateTree();
}

function renderSel() {
  $('sel-title').textContent = `场景（在标签树里勾选，最多 5 个；带「机」= 机器原判）`
    + `　已选 ${sel.length}/${S.max_scenarios}`;
  const box = $('sel-chips'); box.innerHTML = '';
  sel.forEach((sid, idx) => {
    const s = S.scenarios.find(x => x.id === sid);
    const c = document.createElement('span');
    c.className = 'chip sel';
    c.innerHTML = `${sid} ${s ? s.path : '?'}<b title="移除">×</b>`;
    c.querySelector('b').onclick = e => { e.stopPropagation(); sel.splice(idx, 1);
                                          mark(); renderSel(); updateTree(); };
    box.appendChild(c);
  });
}

function updateTree() {
  const machine = new Set(noteOf(cur).machine.scenarios.map(s => s.id));
  const selSet = new Set(sel);
  const cntByL1 = {};
  for (const row of $('tree').querySelectorAll('.leaf')) {
    const id = row.dataset.id;
    row.querySelector('input').checked = selSet.has(id);
    row.classList.toggle('checked', selSet.has(id));
    row.querySelector('.m').style.display = machine.has(id) ? '' : 'none';
    if (selSet.has(id)) cntByL1[row.dataset.l1] = (cntByL1[row.dataset.l1] || 0) + 1;
  }
  for (const g of treeData) {
    g._el && (g._el._h.querySelector('.cnt').textContent =
              cntByL1[g.l1] ? `已选 ${cntByL1[g.l1]}` : '');
  }
  // 自动展开包含已选/机器建议的组（只加不减，尊重手动展开）
  for (const row of $('tree').querySelectorAll('.leaf')) {
    if (selSet.has(row.dataset.id) || machine.has(row.dataset.id)) {
      expanded.l1.add(row.dataset.l1); expanded.l2.add(row.dataset.key);
    }
  }
  applyFilter();
}

function applyFilter() {
  const q = $('search').value.trim().toLowerCase();
  const searching = !!q;
  for (const g of treeData) {
    const l1b = $('tree').querySelector(`.l1b[data-l1="${CSS.escape(g.l1)}"]`);
    if (!l1b) continue;
    if (!g._el) g._el = l1b;
    let anyVisible = false;
    for (const l2b of l1b.querySelectorAll('.l2b')) {
      let vis = false;
      for (const row of l2b.querySelectorAll('.leaf')) {
        const s = S.scenarios.find(x => x.id === row.dataset.id);
        const hit = !searching ||
          (s && (s.path.toLowerCase().includes(q) || s.id.toLowerCase() === q ||
                 s.definition.toLowerCase().includes(q)));
        const open = searching || expanded.l2.has(row.dataset.key);
        row.classList.toggle('hidden', !(hit && open));
        if (hit) vis = true;
      }
      l2b.classList.toggle('closed', searching ? !vis : !expanded.l2.has(l2b.querySelector('.leaf').dataset.key));
      l2b._h.textContent = (searching || expanded.l2.has(
        l2b.querySelector('.leaf').dataset.key) ? '▾ ' : '▸ ') + l2b.querySelector('.leaf').dataset.key.split('/')[1];
      if (vis) anyVisible = true;
    }
    const l1open = searching || expanded.l1.has(g.l1);
    l1b.classList.toggle('closed', !l1open);
    l1b._h.querySelector('.arrow').textContent = l1open ? '▾' : '▸';
    if (searching && !anyVisible) l1b.classList.add('closed');
  }
}

const doneCount = () => Object.values(S.session || {})
  .filter(r => ['keep', 'done', 'drop', 'insufficient'].includes(r.status)).length;

async function save(status, advance) {
  const n = noteOf(cur);
  if (!reviewer) { $('who').focus(); $('who').classList.add('missing');
                   return toast('请先在右上角填写复核人名字'); }
  const body = {
    note_id: n.note_id,
    reviewer,
    scenarios: sel,
    intents: [...$('intents').children].filter(x => x.classList.contains('on'))
              .map(x => x.dataset.id),
    bad_fit: $('badfit').checked,
    new_scenario: $('badfit-text').value.trim(),
    persona: $('persona').value.split('\n').map(x => x.trim()).filter(Boolean),
    comment: $('comment').value.trim(),
    missing_info: $('missing').value.trim(),
    status,
  };
  const res = await (await fetch('/api/save', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) })).json();
  if (!res.ok) return toast('保存失败: ' + (res.error || ''));
  (S.session || (S.session = {}))[n.note_id] = { ...body, reviewer };
  dirty = false;
  $('saved').textContent = `已保存（${VERDICT_CN[status] || status}）`;
  const done = doneCount();
  $('bar').firstElementChild.style.width = (100 * done / S.total) + '%';
  $('meta').textContent = `复核人 ${reviewer} · ${S.run} · ${done}/${S.total}`;
  if (advance) go(nextIdx());
}
function nextIdx() {
  for (let i = 1; i <= S.notes.length; i++) {
    const j = (cur + i) % S.notes.length;
    if (statusOf(j) === 'todo') return j;
  }
  return Math.min(cur + 1, S.notes.length - 1);
}

async function exportX() {
  if (!reviewer) return toast('请先填写复核人');
  const res = await (await fetch('/api/export', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reviewer }) })).json();
  toast(res.ok ? `已导出 ${res.done}/${res.total} → ${res.path}` : '导出失败: ' + (res.error || ''));
}
async function importX() {
  const f = $('file').files[0]; if (!f) return;
  if (!reviewer) return toast('请先填写复核人');
  const fd = new FormData(); fd.append('file', f); fd.append('reviewer', reviewer);
  const res = await (await fetch('/api/import', { method: 'POST', body: fd })).json();
  if (res.ok) { await fetchState(); renderList(); renderNote();
    toast(`已导入 ${res.imported} 条，进度 ${res.done}/${res.total}`); }
  else toast('导入失败: ' + (res.error || ''));
  $('file').value = '';
}
boot();
</script>
</body>
