<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathPal · 人机对话改写预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202c40;font:15px/1.7 system-ui}header{padding:22px 28px;background:#172d40;color:white}h1{font-size:23px;margin:0}header p{margin:5px 0;color:#c8dae7}.toolbar{padding:15px 24px;display:flex;gap:10px;flex-wrap:wrap;background:white;border-bottom:1px solid #dbe1e9}button,a.btn,select,input{font:inherit;padding:7px 12px;border:1px solid #c5d0dd;border-radius:7px;background:white;color:#263e52}button{cursor:pointer}button.primary{background:#146e67;color:white;border-color:#146e67}button:disabled{opacity:.5}main{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px}nav{max-height:76vh;overflow:auto}nav button{display:block;width:100%;text-align:left;margin-bottom:7px}nav button.active{border:2px solid #146e67;background:#eaf6f3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:18px;background:white;border:1px solid #dce3eb;border-radius:10px}.card h3{margin:0 0 10px;font-size:16px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}textarea{width:100%;min-height:280px;font:inherit;resize:vertical;padding:12px;border:1px solid #b8c9ce;border-radius:6px}#query{min-height:110px}#knowledge{min-height:180px}.pathchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pathchip{background:#edf7f5;border:1px solid #9bc9c2;border-radius:16px;padding:3px 9px}.pathchip b{cursor:pointer;margin-left:7px}.pathpicker{max-height:360px;overflow:auto;border:1px solid #d3dde7;border-radius:7px;padding:8px 12px;margin-top:10px;background:#f9fbfd}.pathpicker details{margin:4px 0 4px 14px}.pathpicker label{display:block;margin:2px 0 2px 30px}small,.muted{color:#66798c}#status{margin-left:auto}#message,#querymessage,#knowledgemessage{color:#a35413}#changes{padding-left:20px}h2{margin:0 0 14px}details{margin-top:14px}a{color:#126c77}.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}@media(max-width:900px){main,.grid{grid-template-columns:1fr}nav{max-height:180px}}
</style>
<header><h1>PathPal · 把原帖转成向 AI 的提问</h1><p>保留经历、情绪和啰嗦，只调整求助对象及平台交互。query 沿用原草稿。</p></header>
<div class="toolbar"><input id="search" placeholder="搜索标题、正文或 ID"><select id="filter"><option value="all">全部笔记</option><option value="ready">已生成</option><option value="approved">已确认</option><option value="nocontext">无需上下文</option><option value="notneeded">不需要整条</option><option value="todo">待生成</option></select><button id="refresh">刷新进度</button><button id="batch">生成接下来 12 条</button><a class="btn" href="/api/export">导出已确认内容</a><span id="status"></span></div>
<main><nav id="list"></nav><section><h2 id="title">加载中…</h2><p class="muted" id="id"></p><div class="grid"><div class="card"><h3>原始正文 · 完整保留供对照</h3><pre id="original"></pre><details><summary>查看原 context 草稿</summary><pre id="old"></pre></details></div><div class="card"><h3>新版 context · 可留空</h3><textarea id="context" placeholder="这条只需要 query 时，可以留空或标记“无需上下文”"></textarea><p id="message"></p><ul id="changes"></ul><div class="foot"><button id="generate">生成 context</button><button id="save">保存 context</button><button class="primary" id="approve">确认 context</button><button id="nocontext">标记无需上下文</button><button id="notneeded">标记整条不需要</button></div></div><div class="card" style="grid-column:1/-1"><h3>Query · 可编辑</h3><textarea id="query" placeholder="输入向 AI 提出的明确问题；无需 query 时可标记"></textarea><p id="querymessage"></p><div class="foot"><button id="querygenerate">AI 生成 query</button><button id="querysave">保存 query</button><button class="primary" id="queryapprove">确认 query</button><button id="noquery">标记无需 query</button></div><details><summary>查看原 query 草稿</summary><pre id="oldquery"></pre></details></div><div class="card" style="grid-column:1/-1"><h3>知识库候选 · 默认留空</h3><textarea id="knowledge" placeholder="仅在内容质量好、无广告且值得沉淀时，将知识内容粘贴到这里"></textarea><div id="selectedpaths" class="pathchips"></div><div class="foot"><button id="knowledgejudge">AI 判断知识库路径</button><button id="manualpaths">人工选择路径</button><button id="knowledgesave">保存知识内容</button><button class="primary" id="knowledgeapprove">确认入库候选</button><button id="noknowledge">标记无需入库</button></div><div id="pathpicker" class="pathpicker" hidden></div><p id="knowledgemessage"></p></div></div><p class="muted">知识库内容默认为空，不自动处理。AI 可建议最多三个路径；人工入口按一级/二级目录展开，三级标签作为 .md 文件名，可多选且人工结果优先。确认后保存为入库候选，不会直接写入正式 Markdown 文件。</p></section></main>
<script>
const $=id=>document.getElementById(id);let rows=[],current='',dirty=false,knowledgePaths=[],knowledgeTree={},selectedKnowledgePaths=[];
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function selected(){return rows.find(x=>x.note_id===current)}
function listing(){const q=$('search').value.toLowerCase(),f=$('filter').value;const ready=x=>!!(x.proposal&&!x.proposal.not_needed&&(x.proposal.context||x.proposal.context_not_needed));const list=rows.filter(x=>(x.title+x.original+x.note_id).toLowerCase().includes(q)&&(f==='all'||f==='ready'&&ready(x)||f==='approved'&&x.proposal?.approved||f==='nocontext'&&x.proposal?.context_not_needed||f==='notneeded'&&x.proposal?.not_needed||f==='todo'&&!ready(x)&&!x.proposal?.not_needed));$('list').replaceChildren();for(const r of list){const b=document.createElement('button');b.textContent=(r.proposal?.not_needed?'× ':r.proposal?.context_not_needed?'Q ':r.proposal?.approved?'✓ ':ready(r)?'● ':r.pending?'◷ ':'')+r.title;b.className=r.note_id===current?'active':'';b.onclick=()=>{if(dirty&&!confirm('当前修改尚未保存，仍然切换？'))return;current=r.note_id;dirty=false;render();listing()};$('list').append(b)}$('status').textContent=`${rows.filter(ready).length}/${rows.length} 已处理 · ${rows.filter(x=>x.pending).length} 排队中 · ${rows.filter(x=>x.proposal?.approved).length} 已确认 · ${rows.filter(x=>x.proposal?.context_not_needed).length} 无需上下文 · ${rows.filter(x=>x.proposal?.not_needed).length} 整条不需要`}
function renderSelectedPaths(){const box=$('selectedpaths');box.replaceChildren();for(const path of selectedKnowledgePaths){const chip=document.createElement('span');chip.className='pathchip';chip.append(document.createTextNode(path));const x=document.createElement('b');x.textContent='×';x.onclick=()=>{selectedKnowledgePaths=selectedKnowledgePaths.filter(p=>p!==path);dirty=true;renderSelectedPaths();syncPathChecks();$('knowledgemessage').textContent='路径修改尚未保存'};chip.append(x);box.append(chip)}if(!selectedKnowledgePaths.length){const empty=document.createElement('span');empty.className='muted';empty.textContent='尚未选择知识库路径';box.append(empty)}}
function syncPathChecks(){for(const cb of document.querySelectorAll('#pathpicker input[type=checkbox]'))cb.checked=selectedKnowledgePaths.includes(cb.value)}
function buildPathPicker(){const root=$('pathpicker');root.replaceChildren();for(const [l1,l2s] of Object.entries(knowledgeTree)){const d1=document.createElement('details'),s1=document.createElement('summary');s1.textContent=l1;d1.append(s1);for(const [l2,files] of Object.entries(l2s)){const d2=document.createElement('details'),s2=document.createElement('summary');s2.textContent=`${l1}/${l2}`;d2.append(s2);for(const file of files){const label=document.createElement('label'),cb=document.createElement('input'),path=`${l1}/${l2}/${file}`;cb.type='checkbox';cb.value=path;cb.onchange=()=>{if(cb.checked){if(!selectedKnowledgePaths.includes(path))selectedKnowledgePaths.push(path)}else selectedKnowledgePaths=selectedKnowledgePaths.filter(p=>p!==path);dirty=true;renderSelectedPaths();$('knowledgemessage').textContent='路径修改尚未保存'};label.append(cb,document.createTextNode(' '+file));d2.append(label)}d1.append(d2)}root.append(d1)}syncPathChecks()}
function render(){const r=selected();if(!r)return;const nn=!!r.proposal?.not_needed,nc=!!r.proposal?.context_not_needed,nq=!!r.proposal?.query_not_needed,nk=!!r.proposal?.knowledge_not_needed,has=!!r.proposal;$('title').textContent=r.title;$('id').textContent=r.note_id;$('original').textContent=r.original;$('old').textContent=r.old_context;$('oldquery').textContent=r.original_query||'这条没有原 query 草稿';$('query').value=r.proposal&&Object.hasOwn(r.proposal,'query')?r.proposal.query:(r.original_query||'');$('query').disabled=nn||nq;$('context').value=r.proposal?.context||'';$('context').disabled=!has||nn||nc;$('knowledge').value=r.proposal?.knowledge_content||'';selectedKnowledgePaths=[...(r.proposal?.knowledge_paths||((r.proposal?.knowledge_path)?[r.proposal.knowledge_path]:[]))];renderSelectedPaths();syncPathChecks();$('knowledge').disabled=nn||nk;$('generate').disabled=has||nn||nc||r.pending;$('save').disabled=$('approve').disabled=!has||nn;$('querysave').disabled=$('queryapprove').disabled=nn||nq;$('querygenerate').disabled=nn||nq;$('knowledgejudge').disabled=$('knowledgesave').disabled=$('knowledgeapprove').disabled=$('manualpaths').disabled=nn||nk;$('nocontext').textContent=nc?'取消无需上下文':'标记无需上下文';$('noquery').textContent=nq?'取消无需 query':'标记无需 query';$('noknowledge').textContent=nk?'取消无需入库':'标记无需入库';$('notneeded').textContent=nn?'取消整条不需要':'标记整条不需要';$('message').textContent=r.error||(nn?'已标记为整条不需要':nc?'已标记为无需上下文，仅保留 query':r.pending?'正在生成，请稍候':r.proposal?.approved?'已确认（context 可为空）':r.proposal?.needs_review?'有需人工核对的改动，请检查':'');$('querymessage').textContent=nq?'已标记为无需 query':r.proposal?.query_approved||r.query_default_approved?'query 已确认（默认）':'';const kr=r.proposal?.knowledge_reason?`；${r.proposal.knowledge_reason}`:'';$('knowledgemessage').textContent=nk?'已标记为无需入库':r.proposal?.knowledge_approved?`已确认 ${selectedKnowledgePaths.length} 个入库路径${kr}`:selectedKnowledgePaths.length?`${selectedKnowledgePaths.length} 个候选路径${r.proposal?.knowledge_needs_review?'（需人工复核）':''}${kr}`:'';$('changes').replaceChildren();for(const s of r.proposal?.changes||[]){let li=document.createElement('li');li.textContent=s;$('changes').append(li)}}
async function refresh(){if(dirty)return;const d=await api('/api/state');rows=d.rows;knowledgePaths=d.knowledge_paths||[];knowledgeTree=d.knowledge_tree||{};buildPathPicker();if(!current)current=rows.find(x=>x.note_id.startsWith('69edb59d00'))?.note_id||rows[0]?.note_id;listing();render()}
async function save(approved){let r=selected();await api('/api/save',{note_id:current,context:$('context').value,revision:r.proposal.revision,approved});dirty=false;await refresh()}
async function saveQuery(approved){let r=selected();await api('/api/query/save',{note_id:current,query:$('query').value,revision:r.proposal?.revision??null,approved});dirty=false;await refresh()}
async function saveKnowledge(approved){let r=selected();await api('/api/knowledge/save',{note_id:current,content:$('knowledge').value,paths:selectedKnowledgePaths,revision:r.proposal?.revision??null,approved});dirty=false;await refresh()}
function handle(fn){return async()=>{try{await fn()}catch(e){alert(e.message)}}}
$('context').oninput=()=>{dirty=true;$('message').textContent='context 尚未保存'};$('query').oninput=()=>{dirty=true;$('querymessage').textContent='query 尚未保存'};$('knowledge').oninput=()=>{dirty=true;$('knowledgemessage').textContent='知识库候选尚未保存'};$('search').oninput=listing;$('filter').onchange=listing;
$('refresh').onclick=handle(async()=>{if(dirty){alert('请先保存当前修改');return}await refresh()});$('generate').onclick=handle(async()=>{await api('/api/generate',{ids:[current]});await refresh()});$('batch').onclick=handle(async()=>{await api('/api/generate',{ids:rows.filter(x=>!x.proposal&&!x.pending).slice(0,12).map(x=>x.note_id)});await refresh()});$('save').onclick=handle(()=>save(false));$('approve').onclick=handle(()=>save(true));window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};refresh().catch(e=>$('message').textContent=e.message);setInterval(()=>refresh().catch(()=>{}),8000);
$('notneeded').onclick=handle(async()=>{const r=selected();if(dirty&&!confirm('当前修改尚未保存，标记后将放弃这些修改，是否继续？'))return;await api('/api/not-needed',{note_id:current,revision:r.proposal?.revision??null,not_needed:!r.proposal?.not_needed});dirty=false;await refresh()});
$('nocontext').onclick=handle(async()=>{const r=selected();if(dirty&&!confirm('当前修改尚未保存，标记后将暂存并清空 context，是否继续？'))return;await api('/api/context-not-needed',{note_id:current,revision:r.proposal?.revision??null,context_not_needed:!r.proposal?.context_not_needed});dirty=false;await refresh()});
$('querygenerate').onclick=handle(async()=>{const r=selected();$('querymessage').textContent='正在生成 query…';await api('/api/query/generate',{note_id:current,revision:r.proposal?.revision??null});dirty=false;await refresh()});
$('querysave').onclick=handle(()=>saveQuery(false));$('queryapprove').onclick=handle(()=>saveQuery(true));
$('noquery').onclick=handle(async()=>{const r=selected();if(dirty&&!confirm('当前修改尚未保存，标记后将暂存并清空 query，是否继续？'))return;await api('/api/query/not-needed',{note_id:current,revision:r.proposal?.revision??null,query_not_needed:!r.proposal?.query_not_needed,original_query:r.original_query||''});dirty=false;await refresh()});
$('knowledgejudge').onclick=handle(async()=>{const r=selected();if(!$('knowledge').value.trim())throw Error('请先粘贴知识库内容');$('knowledgemessage').textContent='正在判断知识库路径…';await api('/api/knowledge/judge',{note_id:current,revision:r.proposal?.revision??null,content:$('knowledge').value,original_query:r.original_query||''});dirty=false;await refresh()});
$('manualpaths').onclick=()=>{$('pathpicker').hidden=!$('pathpicker').hidden;$('manualpaths').textContent=$('pathpicker').hidden?'人工选择路径':'收起路径选择'};
$('knowledgesave').onclick=handle(()=>saveKnowledge(false));$('knowledgeapprove').onclick=handle(()=>saveKnowledge(true));
$('noknowledge').onclick=handle(async()=>{const r=selected();if(dirty&&!confirm('当前知识库内容尚未保存，仍然切换标记？'))return;await api('/api/knowledge/not-needed',{note_id:current,revision:r.proposal?.revision??null,knowledge_not_needed:!r.proposal?.knowledge_not_needed});dirty=false;await refresh()});
</script></html>
